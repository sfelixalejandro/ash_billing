name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.17'
            otp: '26'
          - elixir: '1.17'
            otp: '27'
          - elixir: '1.18'
            otp: '27'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ash_billing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            examples/saas_example/deps
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        if: matrix.elixir == '1.18'
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Compile production library
        if: matrix.elixir == '1.18'
        run: MIX_ENV=prod mix compile --warnings-as-errors

      - name: Run test suite with coverage
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ash_billing_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: mix test --cover

      - name: Audit dependencies and build release documentation/package
        if: matrix.elixir == '1.18'
        run: |
          mix hex.audit
          mix docs --warnings-as-errors
          mix hex.build

      - name: Compile isolated billing consumer without Stripe credentials
        if: matrix.elixir == '1.18'
        working-directory: examples/stripe_test_mode
        run: |
          mix deps.get
          mix compile --warnings-as-errors
          mix test --no-start

      - name: Verify offline Stripe launcher safety
        if: matrix.elixir == '1.18'
        run: python3 -m unittest discover -s examples/stripe_test_mode -p 'test_*.py'

      - name: Compile, migrate, doctor, and test runnable SaaS reference app
        if: matrix.elixir == '1.18'
        working-directory: examples/saas_example
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: saas_example_dev
          POSTGRES_TEST_DB: saas_example_test
        run: |
          mix deps.get
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix ecto.setup
          mix ash_billing.doctor \
            --customer-resource SaasExample.Accounts.User \
            --subscription-resource SaasExample.Billing.Subscription \
            --deduplication-resource SaasExample.Billing.WebhookEvent \
            --expected-livemode false \
            --strict
          mix test
