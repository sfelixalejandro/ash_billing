name: Bug Report
description: Report a reproducible problem or unexpected error in AshBilling
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Before submitting, please check existing issues to verify this problem has not already been reported.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps, code snippets, or a reproduction repository.
      placeholder: |
        1. Define resource with AshBilling...
        2. Mount webhook at...
        3. Trigger Stripe event...
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Environment Versions
      description: Specify versions of Elixir, Erlang/OTP, Ash, and AshBilling.
      placeholder: "Elixir 1.18.2, OTP 27.2, Ash 3.4.67, AshBilling 0.1.0"
    validations:
      required: true

  - type: input
    id: stripe_version
    attributes:
      label: Stripe API Version (if applicable)
      description: The Stripe API version configured in your Stripe Dashboard or webhook endpoint.
      placeholder: "e.g., 2024-06-20 or 2023-10-16"
    validations:
      required: false

  - type: input
    id: webhook_event
    attributes:
      label: Webhook Event Type (if applicable)
      description: The specific Stripe webhook event being processed when the issue occurred.
      placeholder: "e.g., customer.subscription.updated, invoice.payment_failed"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Stacktraces
      description: Paste any relevant terminal logs, Ash error outputs, or stacktraces.
      render: elixir
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen instead.
      placeholder: Expected subscription to update status to :active...
    validations:
      required: true
