services:
  postgres:
    image: postgres:16-alpine
    container_name: ash_billing_saas_example_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-saas_example_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - saas_example_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-saas_example_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  saas_example_pgdata:
